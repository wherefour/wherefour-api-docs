# Replaces the stock conf.d/default.conf in the nginx image. The Heroku-specific
# config/nginx.conf.erb (ERB-templated, $PORT, X-Forwarded-Proto redirect) is not used
# here: TLS termination and the http->https redirect are handled by the ALB.
server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # The Redoc bundle is ~1.6MB of HTML and compresses to ~100KB.
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # ALB target health check. Static 200 so a check never renders the full bundle.
    location = /health {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # No SPA fallback: Redoc routes entirely via hash fragments (#/tag/...), so a bad
    # path is a real 404 rather than a 200 serving the whole bundle.
    location / {
        try_files $uri $uri/ =404;
    }
}
